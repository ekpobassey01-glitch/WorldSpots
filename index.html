<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorldSpots</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen">

  <!-- Top Navigation -->
  <header class="sticky top-0 z-40 bg-slate-900 border-b border-slate-800 p-4 flex items-center justify-between">
    <h1 class="font-extrabold text-lg tracking-tight">WORLD<span class="text-orange-500">SPOTS</span></h1>
    <div class="flex gap-2">
      <button onclick="openAdmin()" class="bg-slate-800 text-xs px-3 py-2 rounded-lg font-bold">Admin Panel</button>
      <button onclick="alert('To list your spot, pay N10,000 to OPay: 8147699555 (Ekpo Bassey) and send receipt on WhatsApp!')" class="bg-orange-600 text-xs px-3 py-2 rounded-lg font-bold">List Spot</button>
    </div>
  </header>

  <!-- Public Directory -->
  <main id="publicView" class="p-4 max-w-xl mx-auto space-y-4">
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
      <h2 class="font-bold text-sm text-orange-400">🔥 Verified Spotlights</h2>
      <p class="text-xs text-slate-400 mt-1">Browse top businesses & promo spots.</p>
    </div>

    <div id="spotList" class="space-y-3">
      <!-- Sample Listing -->
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-2">
        <h3 class="font-bold text-base">Breeze Lounge & Grill</h3>
        <p class="text-xs text-slate-400">Lekki Phase 1, Lagos • Eateries</p>
        <p class="text-xs text-emerald-400 font-semibold">₦8,500 • Free Drink Promo</p>
        <a href="https://wa.me/2348147699555?text=Hello,%20I%20found%20your%20business%20on%20WorldSpots" target="_blank" onclick="trackLead()" class="block bg-emerald-600 text-center text-xs font-bold py-2.5 rounded-lg">Chat on WhatsApp</a>
      </div>
    </div>
  </main>

  <!-- Admin Dashboard (Hidden until PIN is entered) -->
  <section id="adminView" class="hidden p-4 max-w-xl mx-auto space-y-4">
    <div class="flex items-center justify-between bg-slate-900 border border-slate-800 p-4 rounded-xl">
      <div>
        <h2 class="font-bold text-sm text-emerald-400">Admin Command Center</h2>
        <p class="text-xs text-slate-400">OPay: 8147699555 (Ekpo Bassey)</p>
      </div>
      <button onclick="logoutAdmin()" class="bg-red-500/20 text-red-400 text-xs px-3 py-1.5 rounded-lg font-bold">Lock</button>
    </div>

    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl grid grid-cols-2 gap-3 text-center">
      <div class="bg-slate-950 p-3 rounded-lg">
        <p class="text-xs text-slate-400">Total Leads</p>
        <p id="leadCount" class="text-xl font-extrabold text-blue-400 mt-1">0</p>
      </div>
      <div class="bg-slate-950 p-3 rounded-lg">
        <p class="text-xs text-slate-400">Revenue</p>
        <p class="text-xl font-extrabold text-emerald-400 mt-1">₦10,000</p>
      </div>
    </div>

    <button onclick="showPublic()" class="w-full bg-slate-800 text-xs font-bold py-3 rounded-xl">Back to Live Site</button>
  </section>

  <script>
    function openAdmin() {
      let pin = prompt("Enter Admin PIN:");
      if (pin === "2026") {
        document.getElementById('publicView').classList.add('hidden');
        document.getElementById('adminView').classList.remove('hidden');
        let leads = localStorage.getItem('ws_leads') || 0;
        document.getElementById('leadCount').textContent = leads;
      } else if (pin !== null) {
        alert("Incorrect PIN!");
      }
    }

    function logoutAdmin() {
      document.getElementById('adminView').classList.add('hidden');
      document.getElementById('publicView').classList.remove('hidden');
    }

    function showPublic() {
      document.getElementById('adminView').classList.add('hidden');
      document.getElementById('publicView').classList.remove('hidden');
    }

    function trackLead() {
      let leads = Number(localStorage.getItem('ws_leads') || 0) + 1;
      localStorage.setItem('ws_leads', leads);
    }
  </script>
</body>
</html>
